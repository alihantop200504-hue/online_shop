services:
  postgres:
    image: postgres:15
    container_name: shop_postgres
    restart: always
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

app:
  build: .
  container_name: shop_app
  restart: always
  ports:
    - "8080:8080"
  environment:
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop_db
    SPRING_DATASOURCE_USERNAME: shop
    SPRING_DATASOURCE_PASSWORD: shop
    JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    JWT_EXPIRATION: 86400000
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - uploads:/app/uploads

volumes:
  postgres_data:
  uploads:
